<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChemCompute - 分布式化学计算调度控制台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            chem: {
              50: '#ecfeff',
              500: '#06b6d4',
              600: '#0891b2',
              900: '#164e63',
              dark: '#0b1120',
              card: '#111827',
              border: '#1f2937'
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  <link rel="icon" type="image/png" href="/static/logo.png">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-30 px-6 py-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <div class="flex items-center space-x-3">
          <img src="/static/logo.png" alt="ChemCompute Logo" class="w-10 h-10 rounded-xl object-contain shadow-lg shadow-cyan-500/25 border border-cyan-500/30">
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="text-xl font-bold tracking-tight text-white">ChemCompute</h1>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Node Grid v0.3.0</span>
            </div>
            <p class="text-xs text-slate-400">私有分布式化学与多物理场计算调度平台</p>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <nav class="hidden sm:flex items-center space-x-1 bg-slate-800/60 p-1 rounded-lg border border-slate-700/60 text-xs">
          <button id="tab-grid" onclick="switchView('grid')" class="px-3.5 py-1.5 rounded-md font-medium bg-cyan-600 text-white shadow transition">
            算力网格 (Grid)
          </button>
          <button id="tab-updates" onclick="switchView('updates')" class="px-3.5 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition flex items-center space-x-1">
            <span>版本与灰度 (Updates)</span>
            <span id="badge-update-avail" class="hidden w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
          </button>
        </nav>
      </div>

      <!-- Quick Stats & Actions -->
      <div class="flex items-center space-x-4">
        <div class="hidden md:flex items-center space-x-6 px-4 py-2 rounded-lg bg-slate-800/50 border border-slate-700/50 text-sm">
          <div>
            <span class="text-slate-400 text-xs">节点在线:</span>
            <span id="stat-nodes" class="ml-1.5 font-semibold text-emerald-400">0 / 0</span>
          </div>
          <div class="h-4 w-px bg-slate-700"></div>
          <div>
            <span class="text-slate-400 text-xs">活跃计算:</span>
            <span id="stat-running" class="ml-1.5 font-semibold text-cyan-400">0</span>
          </div>
          <div class="h-4 w-px bg-slate-700"></div>
          <div>
            <span class="text-slate-400 text-xs">完成任务:</span>
            <span id="stat-completed" class="ml-1.5 font-semibold text-slate-200">0</span>
          </div>
        </div>

        <!-- Role & Permissions Guide -->
        <button onclick="openRolesModal()" title="查看管理员与普通用户角色说明" class="px-3 py-2 text-xs font-medium rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center space-x-1.5">
          <span class="text-sm">❓</span>
          <span>角色与权限说明</span>
        </button>

        <!-- Admin Key Quick Widget -->
        <button onclick="openInviteModal()" title="查看与复制管理员密钥 / 集群接入凭据" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 transition flex items-center space-x-2 shadow-sm">
          <span class="text-base">🔑</span>
          <div class="text-left">
            <div class="text-[10px] text-amber-400/80 leading-none">管理员密钥</div>
            <div id="nav-admin-key" class="font-mono font-bold tracking-wider text-amber-200 mt-0.5">加载中...</div>
          </div>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-200 hover:bg-amber-500/30">复制</span>
        </button>

        <!-- Submit Job Button -->
        <button onclick="openJobModal()" class="px-4 py-2 text-sm font-medium rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white shadow-lg shadow-cyan-500/20 transition flex items-center space-x-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span>新建作业</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-10">

    <!-- VIEW 1: GRID & JOBS -->
    <div id="view-grid" class="space-y-10">
      <!-- Section 1: Compute Nodes -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white flex items-center space-x-2">
              <span>算力节点池 (Compute Nodes)</span>
              <span id="node-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0 台</span>
            </h2>
            <p class="text-xs text-slate-400 mt-0.5">宿舍、实验室及云端 GPU 机器组成的算力集群</p>
          </div>
          <button onclick="refreshData()" class="text-xs text-cyan-400 hover:text-cyan-300 flex items-center space-x-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span>刷新节点</span>
          </button>
        </div>

        <!-- Node Cards Grid -->
        <div id="nodes-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
          <!-- Dynamic Nodes inserted by JS -->
        </div>
      </section>

      <!-- Section 2: Jobs Queue & Pipeline -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white">作业调度流水线 (Job Pipeline)</h2>
            <p class="text-xs text-slate-400 mt-0.5">计算任务分配、实时进度与结果收集</p>
          </div>
        </div>

        <!-- Jobs Table Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-800/60 text-xs uppercase text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="px-5 py-3.5">作业 ID / 名称</th>
                  <th class="px-4 py-3.5">引擎</th>
                  <th class="px-4 py-3.5">执行节点</th>
                  <th class="px-4 py-3.5">状态</th>
                  <th class="px-6 py-3.5 w-64">进度</th>
                  <th class="px-4 py-3.5">提交时间</th>
                  <th class="px-5 py-3.5 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="jobs-tbody" class="divide-y divide-slate-800 text-slate-300">
                <!-- Dynamic Rows inserted by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

    <!-- VIEW 2: UPDATES & CANARY ROLLOUT -->
    <div id="view-updates" class="hidden space-y-10">

      <!-- Channel Overview Cards -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white">灰度发布通道 (Rollout Channels)</h2>
            <p class="text-xs text-slate-400 mt-0.5">多级分层发布控制：Canary 快速验证 -> Beta 小范围 -> Stable 生产全量</p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="openReleaseModal()" class="px-3.5 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium shadow transition flex items-center space-x-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
              </svg>
              <span>发布新版本 (Upload Package)</span>
            </button>
            <button onclick="pushUpdateAll()" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs transition">
              一键全量广播推送
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <!-- Canary Card -->
          <div class="bg-slate-900 border border-amber-500/30 rounded-xl p-5 shadow-lg space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/30">Canary 金丝雀</span>
              <span id="count-canary" class="font-mono text-base font-bold text-white">0 节点</span>
            </div>
            <p class="text-xs text-slate-400">先行测试通道（个人主机/开发者机器），接收最新构建以验证核心功能。</p>
            <div class="text-xs text-slate-300 font-mono flex justify-between pt-2 border-t border-slate-800">
              <span class="text-slate-500">最新版本:</span>
              <span id="latest-canary-ver" class="text-amber-400">0.1.0</span>
            </div>
          </div>

          <!-- Beta Card -->
          <div class="bg-slate-900 border border-blue-500/30 rounded-xl p-5 shadow-lg space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/30">Beta 灰度</span>
              <span id="count-beta" class="font-mono text-base font-bold text-white">0 节点</span>
            </div>
            <p class="text-xs text-slate-400">小批量测试（如 LAB-PC01/02），稳定运行 24h 后逐步放量扩大。</p>
            <div class="text-xs text-slate-300 font-mono flex justify-between pt-2 border-t border-slate-800">
              <span class="text-slate-500">最新版本:</span>
              <span id="latest-beta-ver" class="text-blue-400">0.1.0</span>
            </div>
          </div>

          <!-- Stable Card -->
          <div class="bg-slate-900 border border-emerald-500/30 rounded-xl p-5 shadow-lg space-y-3">
            <div class="flex items-center justify-between">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">Stable 生产稳定</span>
              <span id="count-stable" class="font-mono text-base font-bold text-white">0 节点</span>
            </div>
            <p class="text-xs text-slate-400">生产算力池（全量科研集群），仅部署经过双向验证的绝对稳定版本。</p>
            <div class="text-xs text-slate-300 font-mono flex justify-between pt-2 border-t border-slate-800">
              <span class="text-slate-500">最新版本:</span>
              <span id="latest-stable-ver" class="text-emerald-400">0.1.0</span>
            </div>
          </div>
        </div>
      </section>

      <!-- Releases Table -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white">版本发布记录 (Release Manifests)</h2>
            <p class="text-xs text-slate-400 mt-0.5">所有 Agent 核心与 Adapter 算力插件的发布包、哈希与灰度阶段</p>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-800/60 text-xs uppercase text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="px-5 py-3.5">组件 / 版本</th>
                  <th class="px-4 py-3.5">当前通道</th>
                  <th class="px-4 py-3.5">SHA256 校验码</th>
                  <th class="px-4 py-3.5">包大小</th>
                  <th class="px-4 py-3.5">更新日志</th>
                  <th class="px-4 py-3.5">发布时间</th>
                  <th class="px-5 py-3.5 text-right">灰度晋级 / 操作</th>
                </tr>
              </thead>
              <tbody id="releases-tbody" class="divide-y divide-slate-800 text-slate-300">
                <!-- Dynamic Rows inserted by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- Nodes Rollout Matrix -->
      <section>
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-semibold text-white">集群节点版本矩阵 (Nodes Matrix)</h2>
            <p class="text-xs text-slate-400 mt-0.5">各算力节点当前运行版本、所属灰度通道、更新状态与定向推送</p>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-800/60 text-xs uppercase text-slate-400 border-b border-slate-800">
                <tr>
                  <th class="px-5 py-3.5">节点名称 / ID</th>
                  <th class="px-4 py-3.5">Agent 版本</th>
                  <th class="px-4 py-3.5">灰度通道设置</th>
                  <th class="px-4 py-3.5">更新状态</th>
                  <th class="px-4 py-3.5">节点状态</th>
                  <th class="px-5 py-3.5 text-right">热更新操作</th>
                </tr>
              </thead>
              <tbody id="node-matrix-tbody" class="divide-y divide-slate-800 text-slate-300">
                <!-- Dynamic Rows inserted by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

    </div>

  </main>

  <!-- Modal: Submit Job with Built-in Templates -->
  <div id="job-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-base font-semibold text-white flex items-center space-x-2">
            <span>提交新计算作业</span>
            <span class="text-xs px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">支持官方范本</span>
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">选择计算引擎、上传输入压缩包或直接载入预设范本</p>
        </div>
        <button onclick="closeJobModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <!-- Quick Template Library Section -->
      <div class="p-4 rounded-xl bg-slate-800/60 border border-slate-700/60 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-cyan-300 flex items-center space-x-1.5">
            <span>⚡ 官方标准计算范本库 (快速测试与学习)</span>
          </span>
          <span class="text-[11px] text-slate-400">点击即可免传文件直接运行</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <!-- Template 1: GROMACS Water Smoke -->
          <div class="p-3 rounded-lg bg-slate-900/80 border border-slate-700 hover:border-cyan-500/50 transition space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-medium text-xs text-white">💧 GROMACS 水分子动力学</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-cyan-500/10 text-cyan-400">100步极小化</span>
            </div>
            <p class="text-[11px] text-slate-400 leading-tight">包含 conf.gro, topol.top 与 min.mdp 完整水盒模型，适合验证节点与调度器。</p>
            <div class="flex items-center space-x-2 pt-1 border-t border-slate-800 text-xs">
              <button type="button" onclick="loadTemplate('gromacs-water-smoke')" class="px-2 py-1 rounded bg-cyan-600 hover:bg-cyan-500 text-white text-[11px] font-medium transition">
                ⚡ 一键填入
              </button>
              <a href="/api/templates/gromacs-water-smoke/download" target="_blank" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] transition">
                📥 下载范本.zip
              </a>
              <button type="button" onclick="previewTemplate('gromacs-water-smoke')" class="text-cyan-400 hover:text-cyan-300 text-[11px] ml-auto">
                预览代码
              </button>
            </div>
          </div>

          <!-- Template 2: ORCA Water DFT -->
          <div class="p-3 rounded-lg bg-slate-900/80 border border-slate-700 hover:border-cyan-500/50 transition space-y-2">
            <div class="flex items-center justify-between">
              <span class="font-medium text-xs text-white">🧪 ORCA 水分子几何优化</span>
              <span class="text-[10px] px-1.5 py-0.2 rounded bg-indigo-500/10 text-indigo-400">DFT B3LYP</span>
            </div>
            <p class="text-[11px] text-slate-400 leading-tight">标准量子化学 B3LYP/def2-SVP 优化水分子基态几何构型与单点能量。</p>
            <div class="flex items-center space-x-2 pt-1 border-t border-slate-800 text-xs">
              <button type="button" onclick="loadTemplate('orca-water-sp')" class="px-2 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white text-[11px] font-medium transition">
                ⚡ 一键填入
              </button>
              <a href="/api/templates/orca-water-sp/download" target="_blank" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] transition">
                📥 下载范本.zip
              </a>
              <button type="button" onclick="previewTemplate('orca-water-sp')" class="text-indigo-400 hover:text-indigo-300 text-[11px] ml-auto">
                预览代码
              </button>
            </div>
          </div>
        </div>

        <!-- Template Loaded Banner -->
        <div id="template-loaded-banner" class="hidden p-2 rounded bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-between text-xs text-emerald-300">
          <span id="template-loaded-text">已载入官方范本</span>
          <button type="button" onclick="clearTemplate()" class="text-emerald-400 hover:text-white underline text-[11px]">清除范本</button>
        </div>
      </div>

      <form id="job-form" onsubmit="handleJobSubmit(event)" class="space-y-4 text-sm">
        <input type="hidden" id="job-template-id" value="">

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">作业名称 (Job Name)</label>
          <input type="text" id="job-name" required placeholder="如: HA-Cation-20pct-MD01" class="w-full px-3.5 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">计算软件引擎</label>
            <select id="job-adapter" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
              <option value="gromacs">GROMACS (分子动力学)</option>
              <option value="orca">ORCA (量子化学 DFT)</option>
              <option value="comsol">COMSOL (多物理场有限元)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">加速策略</label>
            <div class="flex items-center h-10 space-x-2">
              <input type="checkbox" id="job-require-gpu" checked class="w-4 h-4 text-cyan-600 bg-slate-800 border-slate-700 rounded focus:ring-cyan-500">
              <label for="job-require-gpu" class="text-xs text-slate-300">优先调度至 GPU 节点加速</label>
            </div>
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-xs font-medium text-slate-300">计算输入压缩包 (.zip)</label>
            <span class="text-[11px] text-slate-500">若使用上方范本则无需上传文件</span>
          </div>
          <input type="file" id="job-bundle" accept=".zip" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer">
          
          <!-- Package File Structure Specification Guide -->
          <details class="mt-2 text-xs bg-slate-800/40 rounded-lg p-2.5 border border-slate-800">
            <summary class="cursor-pointer text-cyan-400 font-medium select-none">
              📁 查看计算输入包 (.zip) 规范与目录结构说明
            </summary>
            <div class="mt-2 space-y-2 text-slate-400 font-mono text-[11px] leading-relaxed">
              <p class="text-slate-300">【GROMACS 压缩包建议结构】：</p>
              <div class="bg-black/40 p-2 rounded border border-slate-800">
my_job.zip<br>
├── min.mdp       (分子动力学控制参数文件)<br>
├── conf.gro      (体系初始原子坐标)<br>
└── topol.top     (分子拓扑力场定义)<br>
(或者直接打包编译后的 run.tpr 单文件)
              </div>
              <p class="text-slate-300">【ORCA 压缩包建议结构】：</p>
              <div class="bg-black/40 p-2 rounded border border-slate-800">
my_job.zip<br>
└── water.inp     (包含 !B3LYP 与 * xyz 坐标的控制文件)
              </div>
            </div>
          </details>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeJobModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">取消</button>
          <button type="submit" id="job-submit-btn" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium shadow-md shadow-cyan-500/20 transition">确认提交作业</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Publish Release -->
  <div id="release-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-base font-semibold text-white">发布新版本包 (Release Artifact)</h3>
        <button onclick="closeReleaseModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <form id="release-form" onsubmit="handleReleaseSubmit(event)" class="space-y-4 text-sm">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">目标组件类型</label>
            <select id="rel-component" onchange="toggleAdapterNameInput()" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
              <option value="agent">Agent 核心程序</option>
              <option value="adapter">Adapter 独立插件</option>
            </select>
          </div>
          <div id="adapter-name-container" class="hidden">
            <label class="block text-xs font-medium text-slate-300 mb-1">适配器名称</label>
            <input type="text" id="rel-adapter-name" placeholder="如: gromacs" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">版本号 (SemVer)</label>
            <input type="text" id="rel-version" required placeholder="如: 0.2.0" class="w-full px-3.5 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">初次发布通道</label>
            <select id="rel-channel" class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm">
              <option value="canary">Canary (推荐先金丝雀验证)</option>
              <option value="beta">Beta (小批量灰度)</option>
              <option value="stable">Stable (全量直接发布)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">发布压缩包 (.zip)</label>
          <input type="file" id="rel-file" accept=".zip" required class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-cyan-400 hover:file:bg-slate-700 cursor-pointer">
          <p class="text-[11px] text-slate-500 mt-1">系统将自动计算 SHA256 签名，并提供给各节点进行完整性校验与原子回滚保障。</p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">更新日志 (Changelog)</label>
          <textarea id="rel-changelog" rows="2" placeholder="如: 增强 GROMACS 任务感知更新机制，优化多卡调度..." class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-cyan-500 text-sm"></textarea>
        </div>

        <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-800">
          <button type="button" onclick="closeReleaseModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">取消</button>
          <button type="submit" id="rel-submit-btn" class="px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-medium shadow-md shadow-cyan-500/20 transition">确认发布</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Admin Credentials & Node Join (升级版管理员密钥中心) -->
  <div id="invite-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center space-x-2">
          <span class="text-xl">🔑</span>
          <div>
            <h3 class="text-base font-semibold text-white">管理员密钥与节点凭据中心</h3>
            <p class="text-xs text-slate-400">授权组员与远程计算设备接入您的科研算力池</p>
          </div>
        </div>
        <button onclick="closeInviteModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <div class="space-y-4 text-sm">
        <!-- Prominent Admin Key Display -->
        <div class="p-4 rounded-xl bg-gradient-to-br from-amber-500/10 via-slate-800 to-slate-900 border border-amber-500/30 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">当前生效的管理员密钥 (Admin Key)</span>
            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-medium">就绪可用</span>
          </div>

          <div class="flex items-center justify-between bg-black/50 p-3 rounded-lg border border-amber-500/20">
            <span id="display-admin-key" class="font-mono text-2xl font-bold tracking-widest text-amber-300">加载中...</span>
            <button onclick="copyCurrentAdminKey()" class="px-3.5 py-1.5 rounded-md bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs transition shadow-md">
              一键复制密钥
            </button>
          </div>

          <!-- Quick Copy: One-Line Command -->
          <div class="space-y-1.5">
            <div class="flex items-center justify-between text-xs text-slate-400">
              <span>组员电脑接入命令 (在需要贡献算力的电脑终端运行)：</span>
              <button onclick="copyJoinCommand()" class="text-cyan-400 hover:text-cyan-300 text-[11px] underline">复制加入命令</button>
            </div>
            <div id="display-join-cmd" class="p-2.5 rounded bg-black/70 font-mono text-xs text-cyan-300 border border-slate-800 break-all select-all">
              加载中...
            </div>
          </div>
        </div>

        <!-- Role distinction note -->
        <div class="p-3 rounded-lg bg-blue-500/10 border border-blue-500/20 text-xs text-slate-300 space-y-1">
          <div class="font-semibold text-blue-400 flex items-center space-x-1">
            <span>ℹ️ 谁需要使用这个密钥？</span>
          </div>
          <p class="text-slate-400 text-[11px] leading-relaxed">
            • <b>普通计算节点 (Worker)</b>：组员电脑或实验室 GPU 服务器需要此密钥才能接入本主控；<br>
            • <b>科研提交者 (Submitter)</b>：仅需要投计算任务的师生<b>不需要此密钥</b>，只需打开本 Web 页面提交分子文件即可。
          </p>
        </div>

        <!-- Generate & List Section -->
        <div class="space-y-3 pt-2 border-t border-slate-800">
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-slate-300">历史与备用密钥列表</span>
            <button onclick="createInviteCode()" class="px-3 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs transition flex items-center space-x-1">
              <span>+ 生成新密钥 (7天有效)</span>
            </button>
          </div>
          <div id="invite-list" class="space-y-2 max-h-36 overflow-y-auto pr-1">
            <!-- Codes inserted by JS -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal: Roles & Permissions Guide (角色与权限体系说明) -->
  <div id="roles-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <h3 class="text-base font-semibold text-white flex items-center space-x-2">
            <span>❓ ChemCompute 角色体系与权限划分指南</span>
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">清晰了解“管理员”、“普通节点”与“科研提交者”的区别</p>
        </div>
        <button onclick="closeRolesModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
        <!-- Role 1: Controller Admin -->
        <div class="p-4 rounded-xl bg-slate-800/80 border border-amber-500/30 space-y-2.5">
          <div class="flex items-center space-x-2 text-amber-400 font-semibold text-sm">
            <span>👑 主控管理员</span>
          </div>
          <div class="text-[11px] text-slate-400 font-medium">Controller Admin</div>
          <p class="text-slate-300 leading-relaxed">
            课题组长、实验室管理员或固定服务器。负责启动主控调度中心，掌握<b>管理员密钥</b>，管理算力节点池，监控全网作业流水线。
          </p>
          <div class="pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 space-y-1">
            <div>• 启动：<code class="text-amber-300">启动-管理员主控台.bat</code></div>
            <div>• 访问：<code class="text-amber-300">http://127.0.0.1:8000</code></div>
          </div>
        </div>

        <!-- Role 2: Compute Worker Node -->
        <div class="p-4 rounded-xl bg-slate-800/80 border border-cyan-500/30 space-y-2.5">
          <div class="flex items-center space-x-2 text-cyan-400 font-semibold text-sm">
            <span>💻 普通计算节点</span>
          </div>
          <div class="text-[11px] text-slate-400 font-medium">Compute Worker Node</div>
          <p class="text-slate-300 leading-relaxed">
            组员电脑、宿舍游戏本、实验室高性能台式机。下载安装包后输入管理员给的<b>管理员密钥</b>，后台默默承接 GROMACS/ORCA 分子模拟。
          </p>
          <div class="pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 space-y-1">
            <div>• 启动：<code class="text-cyan-300">启动-普通计算节点.bat</code></div>
            <div>• 权限：计算环境隔离，无权修改主控</div>
          </div>
        </div>

        <!-- Role 3: Submitter -->
        <div class="p-4 rounded-xl bg-slate-800/80 border border-emerald-500/30 space-y-2.5">
          <div class="flex items-center space-x-2 text-emerald-400 font-semibold text-sm">
            <span>🔬 科研提交者</span>
          </div>
          <div class="text-[11px] text-slate-400 font-medium">Researcher / Submitter</div>
          <p class="text-slate-300 leading-relaxed">
            需要跑分子计算的研究生或学者。<b>无需安装复杂的 GROMACS 或 GPU 驱动</b>，只需浏览器打开主控 IP，上传分子压缩包或选用范本，即刻计算。
          </p>
          <div class="pt-2 border-t border-slate-700/60 text-[11px] text-slate-400 space-y-1">
            <div>• 方式：浏览器直接访问 Web 页面</div>
            <div>• 操作：投任务、看轨迹收敛、下结果</div>
          </div>
        </div>
      </div>

      <div class="p-3.5 rounded-xl bg-slate-800/40 border border-slate-800 text-xs text-slate-400 space-y-1.5">
        <div class="font-semibold text-slate-200">💡 极简操作总结：</div>
        <p>1. 如果您是一台机器的拥有者想组建算力池：点开 <b>【启动-管理员主控台.bat】</b>，点击右上角复制 <b>【管理员密钥】</b>；</p>
        <p>2. 如果其他同学想贡献显卡算力：把管理员密钥发给他们，让他们点 <b>【启动-普通计算节点.bat】</b> 填入即可；</p>
        <p>3. 如果大家要做化学计算：直接在浏览器新建作业，选择官方范本或上传分子包，调度器自动并发分发执行！</p>
      </div>
    </div>
  </div>

  <div id="preview-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

          <h3 id="preview-title" class="text-sm font-semibold text-white">范本文件预览</h3>
          <p id="preview-desc" class="text-xs text-slate-400 mt-0.5"></p>

    <span class="text-base">✓</span>
    <span id="toast-text">已复制</span>
  </div>

  <!-- Modal: Live Log Viewer -->
  <div id="log-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div class="flex items-center space-x-2">
          <div class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></div>
          <h3 id="log-title" class="text-sm font-semibold text-white">作业日志</h3>
        </div>
        <button onclick="closeLogModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>

      <div class="bg-black/90 rounded-lg p-4 font-mono text-xs text-slate-300 h-80 overflow-y-auto border border-slate-800 whitespace-pre-wrap leading-relaxed" id="log-content">
        加载日志中...
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>

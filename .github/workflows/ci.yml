name: Test and Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Install compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.3 --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test packaged program
        run: python scripts/smoke_exe.py dist/ChemCompute/ChemCompute.exe
      - name: Test install and uninstall
        shell: pwsh
        run: ./scripts/smoke_installer.ps1 -TestRoot "$env:RUNNER_TEMP/chemcompute-install-test"
      - uses: actions/upload-artifact@v4
        with:
          name: ChemCompute-Windows-x64
          path: |
            dist/ChemCompute-Setup.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChemCompute-Windows-x64
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --prerelease --title "ChemCompute $TAG" --generate-notes

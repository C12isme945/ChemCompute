name: Test and Windows installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate optional dependency plan
        shell: pwsh
        run: ./scripts/dependencies.ps1 -WSL -Gromacs -Drivers -PlanOnly
      - name: Install compiler
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP/innosetup-6.7.3.exe"
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler checksum mismatch' }
          $installDir = "$env:RUNNER_TEMP/InnoSetup"
          $proc = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',('/DIR="'+$installDir+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw 'Compiler installation failed' }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build.ps1 -ISCC "$env:RUNNER_TEMP/InnoSetup/ISCC.exe"
      - name: Test packaged program
        run: python scripts/smoke_exe.py dist/ChemCompute/ChemCompute.exe
      - name: Test native console and desktop controls
        run: python scripts/smoke_desktop.py dist/ChemCompute/ChemCompute.exe
      - name: Test install and uninstall
        shell: pwsh
        run: ./scripts/smoke_installer.ps1 -TestRoot "$env:RUNNER_TEMP/chemcompute-install-test"
      - uses: actions/upload-artifact@v4
        with:
          name: ChemCompute-Windows-x64
          path: |
            dist/ChemCompute-Setup.exe
            dist/SHA256SUMS.txt
            dist/ChemCompute-Water-Smoke.zip
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChemCompute-Windows-x64
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already published; updating release assets with --clobber..."
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --prerelease --title "ChemCompute $TAG" --generate-notes
          fi
